<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bot Bot — Guest</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: #0f0f13;
        color: #eee;
        height: 100vh;
        display: flex;
        flex-direction: column;
    }
    header {
        padding: 14px 20px;
        background: #17171d;
        border-bottom: 1px solid #2a2a33;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    header .mode-tag {
        font-size: 12px;
        color: #9a9aa5;
        font-weight: 400;
    }
    #chat {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .msg {
        max-width: 70%;
        padding: 10px 14px;
        border-radius: 14px;
        line-height: 1.4;
        white-space: pre-wrap;
        word-wrap: break-word;
    }
    .user {
        align-self: flex-end;
        background: #4f7cff;
        color: white;
        border-bottom-right-radius: 4px;
    }
    .bot {
        align-self: flex-start;
        background: #23232b;
        color: #eee;
        border-bottom-left-radius: 4px;
    }
    .typing {
        align-self: flex-start;
        background: #23232b;
        color: #9a9aa5;
        font-style: italic;
        padding: 10px 14px;
        border-radius: 14px;
    }
    #inputRow {
        display: flex;
        padding: 14px;
        gap: 10px;
        background: #17171d;
        border-top: 1px solid #2a2a33;
    }
    #messageInput {
        flex: 1;
        padding: 12px 14px;
        border-radius: 20px;
        border: 1px solid #2a2a33;
        background: #0f0f13;
        color: #eee;
        font-size: 15px;
        outline: none;
    }
    #sendBtn {
        padding: 12px 20px;
        border-radius: 20px;
        border: none;
        background: #4f7cff;
        color: white;
        font-weight: 600;
        cursor: pointer;
    }
    #sendBtn:disabled {
        background: #3a3a45;
        cursor: not-allowed;
    }
    #attachBtn {
        padding: 12px 16px;
        border-radius: 20px;
        border: 1px solid #2a2a33;
        background: #1c1c24;
        color: #9a9aa5;
        cursor: pointer;
        font-size: 16px;
    }
    #attachBtn.has-file {
        background: #4f7cff;
        color: white;
        border-color: #4f7cff;
    }
    #sessionRow {
        padding: 8px 20px;
        font-size: 12px;
        color: #9a9aa5;
        background: #17171d;
        border-bottom: 1px solid #2a2a33;
        display: flex;
        gap: 10px;
        align-items: center;
    }
    #sessionRow input {
        background: #0f0f13;
        border: 1px solid #2a2a33;
        color: #eee;
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 12px;
    }
    #sessionRow button {
        background: none;
        border: 1px solid #2a2a33;
        color: #9a9aa5;
        padding: 4px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
    }
</style>
</head>
<body>

<header>
    <span>Bot Bot (guest)</span>
    <span class="mode-tag" id="modeTag">mode: —</span>
</header>

<div id="sessionRow">
    session: <b>guestsession1</b> (fixed for this device — server-enforced)
</div>

<div id="chat"></div>

<div id="inputRow">
    <input type="file" id="fileInput" accept="image/*,.pdf,.docx,.txt" style="display:none" onchange="onFileSelected()" />
    <button id="attachBtn" onclick="document.getElementById('fileInput').click()" title="Attach a file">📎</button>
    <input id="messageInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()" />
    <button id="sendBtn" onclick="sendMessage()">Send</button>
</div>

<script>
    // Laptop's LAN IP — if it changes, update this line.
    // (Tailscale alternative: http://100.107.37.82:8000)
    const BACKEND_URL = "http://192.168.116.192:8000";
    // Must match secret_key.py on the server exactly.
    // This guest's own scoped key — server-side session scoping applies.
    const GUEST_SESSION_ID = "guestsession1";
    const API_KEY = "gLaJT_wi2NmrNnlx3Jn17NYlcjhODsZVYZDhq7yDLgw";

    function addMessage(text, sender) {
        const chat = document.getElementById("chat");
        const div = document.createElement("div");
        div.className = "msg " + sender;
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    function showTyping() {
        const chat = document.getElementById("chat");
        const div = document.createElement("div");
        div.className = "typing";
        div.id = "typingIndicator";
        div.textContent = "Bot Bot is typing...";
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function removeTyping() {
        const el = document.getElementById("typingIndicator");
        if (el) el.remove();
    }

    let selectedFile = null;

    function onFileSelected() {
        const fileInput = document.getElementById("fileInput");
        const attachBtn = document.getElementById("attachBtn");
        selectedFile = fileInput.files[0] || null;
        attachBtn.classList.toggle("has-file", !!selectedFile);
        attachBtn.title = selectedFile ? `Attached: ${selectedFile.name} (click to change)` : "Attach a file";
    }

    async function sendMessage() {
        const input = document.getElementById("messageInput");
        const sendBtn = document.getElementById("sendBtn");
        const attachBtn = document.getElementById("attachBtn");
        const sessionId = GUEST_SESSION_ID;
        const message = input.value.trim();

        if (!message && !selectedFile) return;

        addMessage(selectedFile ? `${message} 📎 ${selectedFile.name}`.trim() : message, "user");
        input.value = "";
        sendBtn.disabled = true;
        showTyping();

        try {
            let res;
            if (selectedFile) {
                const formData = new FormData();
                formData.append("file", selectedFile);
                formData.append("message", message);
                formData.append("session_id", sessionId);
                res = await fetch(`${BACKEND_URL}/chat/upload`, {
                    method: "POST",
                    headers: { "X-API-Key": API_KEY },
                    body: formData
                });
            } else {
                res = await fetch(`${BACKEND_URL}/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "X-API-Key": API_KEY },
                    body: JSON.stringify({ message: message, session_id: sessionId })
                });
            }

            if (!res.ok) throw new Error(`Server returned ${res.status}`);

            const data = await res.json();
            removeTyping();
            addMessage(data.reply, "bot");
            document.getElementById("modeTag").textContent = "mode: " + data.mode;
        } catch (err) {
            removeTyping();
            addMessage("⚠️ Couldn't reach Bot Bot. Is the server running? (" + err.message + ")", "bot");
        } finally {
            selectedFile = null;
            document.getElementById("fileInput").value = "";
            attachBtn.classList.remove("has-file");
            attachBtn.title = "Attach a file";
            sendBtn.disabled = false;
            input.focus();
        }
    }



    async function loadHistory(sessionId) {
        document.getElementById("chat").innerHTML = "";
        try {
            const res = await fetch(`${BACKEND_URL}/history/${encodeURIComponent(sessionId)}`, {
                headers: { "X-API-Key": API_KEY }
            });
            if (!res.ok) return;
            const data = await res.json();
            (data.messages || []).forEach(m => {
                addMessage(m.content, m.role === "user" ? "user" : "bot");
            });
        } catch (err) {
            console.error("Failed to load history:", err);
        }
    }

    document.getElementById("messageInput").focus();
    loadHistory(GUEST_SESSION_ID);

</script>

</body>
</html>
